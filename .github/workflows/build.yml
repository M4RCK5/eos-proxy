name: Build DLL

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        run: .\build.bat

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: EOSSDK-Win64-Shipping
          path: EOSSDK-Win64-Shipping.dll
